<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>BhuNexus — Officer Login</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="auth-page">

  <header class="site-header">

    <div class="nav-inner">

      <a href="index.html" class="brand" aria-label="BhuNexus Home">

        <div class="brand-icon" aria-hidden="true">

          <svg
            width="36"
            height="36"
            viewBox="0 0 36 36"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >

            <rect
              width="36"
              height="36"
              rx="8"
              fill="#1a6e8a"
            />

            <path
              d="M8 26 L14 10 L21 18 L26 12 L28 26 Z"
              fill="none"
              stroke="#7dd3e8"
              stroke-width="1.5"
              stroke-linejoin="round"
            />

            <circle
              cx="26"
              cy="12"
              r="2.5"
              fill="#f0c040"
            />

            <line
              x1="8"
              y1="26"
              x2="28"
              y2="26"
              stroke="#7dd3e8"
              stroke-width="1.2"
            />

          </svg>

        </div>

        <div class="brand-text">

          <span class="brand-name">
            BhuNexus
          </span>

          <span class="brand-tagline">
            Digital Land Governance
          </span>

        </div>

      </a>

      <a href="index.html" class="auth-home-link">
        ← Back to Home
      </a>

    </div>

  </header>


  <main class="auth-main">

    <section class="auth-card officer-auth-card">

      <div class="auth-icon officer-icon">
        <span>▣</span>
      </div>

      <p class="auth-eyebrow">
        ADMINISTRATIVE PORTAL
      </p>

      <h1>
        Officer Login
      </h1>

      <p class="auth-description">
        Access land governance, parcel verification and
        administrative analytics through BhuNexus.
      </p>


      <form id="officerLoginForm" class="auth-form">

        <div class="auth-field">

          <label for="officerId">
            Officer ID
          </label>

          <input
            type="text"
            id="officerId"
            placeholder="Enter officer ID"
            autocomplete="username"
            required
          />

        </div>


        <div class="auth-field">

          <label for="officerPassword">
            Password
          </label>

          <input
            type="password"
            id="officerPassword"
            placeholder="Enter password"
            autocomplete="current-password"
            required
          />

        </div>


        <div class="auth-field">

          <label for="department">
            Department
          </label>

          <select id="department">

            <option value="land-records">
              Land Records
            </option>

            <option value="revenue">
              Revenue Department
            </option>

            <option value="planning">
              Town Planning
            </option>

            <option value="registration">
              Registration
            </option>

          </select>

        </div>


        <button
          type="submit"
          class="auth-submit officer-submit"
        >

          Login as Officer

          <span>→</span>

        </button>

      </form>


      <div class="demo-login-note">

        <strong>Prototype Demo</strong>

        <span>
          Use any non-empty officer ID and password to continue.
        </span>

      </div>


      <div class="auth-divider">
        <span>OR</span>
      </div>


      <a href="citizen-login.html" class="switch-login">
        Login as Citizen
      </a>


      <a href="index.html" class="auth-back">
        ← Return to BhuNexus
      </a>

    </section>

  </main>


  <script>

    const officerLoginForm =
      document.getElementById("officerLoginForm");


    officerLoginForm.addEventListener("submit", function (event) {

      event.preventDefault();


      const officerId =
        document.getElementById("officerId").value.trim();

      const password =
        document.getElementById("officerPassword").value.trim();


      if (!officerId || !password) {

        alert("Please enter Officer ID and password.");

        return;
      }


      window.location.href = "officer-dashboard.html";

    });

  </script>

</body>

</html>
